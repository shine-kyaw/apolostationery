<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shop — APOLO Stationery Myanmar</title>
<meta name="description" content="Every APOLO product: exercise books, pens, pencils, desk accessories, files, envelopes, ledgers and copy paper. Door-to-door delivery and cash on delivery across Myanmar.">
<meta name="theme-color" content="#EC008C">
<link rel="icon" href="/img/apolo-logo.png">
<link rel="preconnect" href="https://cdn.shopify.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="fetch" href="/data/catalog.json" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Padauk:wght@400;700&display=swap">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/site.css">
</head>
<body>
<a class="skip" href="#grid">Skip to products</a>
<header id="hdr"></header>

<main class="page" id="main">
  <div class="wrap">
    <nav class="crumbs" aria-label="Breadcrumb"><ol id="crumbs"><li><a href="/">Home</a></li></ol></nav>

    <header class="shop__head" id="shopHead">
      <p class="eyebrow"><span>06</span> The catalogue</p>
      <h1 class="page-h1">Shop</h1>
    </header>

    <nav class="tabs" id="tabs" aria-label="Categories"></nav>

    <div class="bar">
      <div class="bar__start">
        <span class="bar__count" id="count" aria-live="polite"></span>
      </div>
      <div class="bar__end">
        <button type="button" class="btn btn--ghost filter-btn" id="filterBtn" aria-expanded="false" aria-controls="filters">Filter</button>
        <label class="select">
          <span class="sr-only">Sort by</span>
          <select id="sort"></select>
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
        </label>
      </div>
    </div>

    <div class="shop__layout">
      <form class="filters" id="filters" aria-label="Filter products"></form>
      <div>
        <div class="grid" id="grid" tabindex="-1"></div>
        <div class="more" id="more" hidden><button type="button" class="btn btn--ghost" id="moreBtn">Show more</button></div>
      </div>
    </div>
  </div>
</main>

<footer id="ftr"></footer>
<script type="module" src="/js/pages/shop.js"></script>
</body>
</html>
